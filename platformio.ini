[platformio]
default_envs = fase_10_integracao_final


; ============================================================
; Configurações compartilhadas por todas as fases
; ============================================================

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino

upload_protocol = arduino

monitor_speed = 250000

monitor_filters =
    time
    colorize


; ============================================================
; FASE 00 — Estrutura inicial do projeto
; ============================================================

[env:fase_00_estrutura]

build_src_filter =
    -<*>
    +<fase_00_estrutura/**>


; ============================================================
; FASE 01 — Sensor AS5600
; ============================================================

[env:fase_01_sensor]

build_src_filter =
    -<*>
    +<fase_01_sensor/**>

lib_deps =
    robtillaart/AS5600


; ============================================================
; FASE 02 — Controle isolado do motor
; ============================================================

[env:fase_02_motor]

build_src_filter =
    -<*>
    +<fase_02_motor/**>

lib_deps =
    waspinator/AccelStepper


; ============================================================
; FASE 03 — Referência e limites do braço
; ============================================================

[env:fase_03_referencia_limites]

build_src_filter =
    -<*>
    +<fase_03_referencia_limites/**>

lib_deps =
    waspinator/AccelStepper


; ============================================================
; FASE 04 — Limites dinâmicos do motor
; ============================================================

[env:fase_04_limites_motor]

build_src_filter =
    -<*>
    +<fase_04_limites_motor/**>

lib_deps =
    waspinator/AccelStepper


; ============================================================
; FASE 05 — Aquisição dos estados do pêndulo
; ============================================================

[env:fase_05_aquisicao]

build_src_filter =
    -<*>
    +<fase_05_aquisicao/**>

lib_deps =
    robtillaart/AS5600


; ============================================================
; FASE 06 — Reservada para próxima etapa
; ============================================================

[env:fase_06_atuador]

build_src_filter =
    -<*>
   +<fase_06_atuador/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 07 — Swing-up por energia
; ============================================================

[env:fase_07_identifica]

build_src_filter =
    -<*>
    +<fase_07_identifica/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 08 — Captura da posição vertical
; ============================================================

[env:fase_08_projetoPD]

build_src_filter =
    -<*>
    +<fase_08_projetoPD/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 09 — Balanceamento
; ============================================================

[env:fase_09_projetoMotorPendulo]

build_src_filter =
    -<*>
    +<fase_09_projetoMotorPendulo BalanceTelemetry/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 10 — Integração final
; ============================================================

[env:fase_10_integracao_final]

build_src_filter =
    -<*>
    +<fase_10_integracao_final/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper