[platformio]
default_envs = fase_12_impulso_sincronizado

; ============================================================
; Configurações compartilhadas por todas as fases
; ============================================================

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino

upload_protocol = arduino

monitor_speed = 250000

monitor_filters =
    time
    colorize


; ============================================================
; FASE 00 — Estrutura inicial do projeto
; ============================================================

[env:fase_00_estrutura]

build_src_filter =
    -<*>
    +<fase_00_estrutura/**>


; ============================================================
; FASE 01 — Sensor AS5600
; ============================================================

[env:fase_01_sensor]

build_src_filter =
    -<*>
    +<fase_01_sensor/**>

lib_deps =
    robtillaart/AS5600


; ============================================================
; FASE 02 — Controle isolado do motor
; ============================================================

[env:fase_02_motor]

build_src_filter =
    -<*>
    +<fase_02_motor/**>

lib_deps =
    waspinator/AccelStepper


; ============================================================
; FASE 03 — Referência e limites do braço
; ============================================================

[env:fase_03_referencia_limites]

build_src_filter =
    -<*>
    +<fase_03_referencia_limites/**>

lib_deps =
    waspinator/AccelStepper


; ============================================================
; FASE 04 — Limites dinâmicos do motor
; ============================================================

[env:fase_04_limites_motor]

build_src_filter =
    -<*>
    +<fase_04_limites_motor/**>

lib_deps =
    waspinator/AccelStepper


; ============================================================
; FASE 05 — Aquisição determinística do pêndulo
; Posição + betaDot a 250 Hz
; ============================================================

[env:fase_05_aquisicao]

build_src_filter =
    -<*>
    +<fase_05_aquisicao/**>

lib_deps =
    robtillaart/AS5600


; ============================================================
; FASE 06 — Caracterização do atuador
; Velocidade, aceleração, reversões e perda de passos
; ============================================================

[env:fase_06_atuador]

build_src_filter =
    -<*>
    +<fase_06_atuador/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 07 — Identificação experimental local
; Dinâmica próxima da posição vertical
; ============================================================

[env:fase_07_identifica]

build_src_filter =
    -<*>
    +<fase_07_identifica/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 08 — Projeto e validação do controlador PD
; Controle local do pêndulo próximo à vertical
; ============================================================

[env:fase_08_projetoPD]

build_src_filter =
    -<*>
    +<fase_08_projetoPD/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 09 — Controle conjunto motor + pêndulo
; Realimentação dos quatro estados
; ============================================================

[env:fase_09_projetoMotorPendulo]

build_src_filter =
    -<*>
    +<fase_09_projetoMotorPendulo/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 10 — Integração final do BALANCE
; Arquitetura modular + telemetria
; ============================================================

[env:fase_10_integracao_final]

build_src_filter =
    -<*>
    +<fase_10_integracao_final/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 11 — Observação da oscilação e energia
;
; Objetivos:
; - observar o pêndulo em oscilação livre
; - reconhecer passagem por DOWN
; - reconhecer picos
; - reconhecer o sentido do movimento
; - medir período e amortecimento
; - construir uma medida/proxy de energia
;
; Nesta fase o braço não realiza swing-up.
; ============================================================

[env:fase_11_observacao_energia]

build_src_filter =
    -<*>
    +<fase_11_observacao_energia/**>

lib_deps =
    robtillaart/AS5600


; ============================================================
; FASE 12 — Impulso sincronizado
;
; Objetivos:
; - aplicar uma única excitação do braço
; - sincronizar a excitação com a fase do pêndulo
; - verificar experimentalmente o sinal correto
; - medir o incremento ou redução de energia
;
; Ainda não há swing-up contínuo.
; ============================================================

[env:fase_12_impulso_sincronizado]

build_src_filter =
    -<*>
    +<fase_12_impulso_sincronizado/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 13 — Bombeamento ST básico
;
; Objetivos:
; - repetir impulsos sincronizados
; - aumentar progressivamente a amplitude
; - reproduzir a ideia básica da estratégia ST
; - verificar deriva do braço
;
; Intensidade dos impulsos inicialmente fixa.
; ============================================================

[env:fase_13_bombeamento_st]

build_src_filter =
    -<*>
    +<fase_13_bombeamento_st/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 14 — Controle do incremento de energia
;
; Objetivos:
; - estimar a energia a cada ciclo
; - medir o efeito produzido pelo último impulso
; - adaptar a intensidade do próximo impulso
; - obter crescimento controlado da energia
;
; Estratégia:
; evento de fase + energia -> próxima excitação
; ============================================================

[env:fase_14_controle_energia]

build_src_filter =
    -<*>
    +<fase_14_controle_energia/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 15 — Aproximação controlada ao topo
;
; Objetivos:
; - reduzir progressivamente o incremento de energia
; - aproximar o pêndulo da energia necessária para TOP
; - considerar explicitamente a posição do braço
; - preservar margem física para a captura
;
; Ainda não ocorre transição para BALANCE.
; ============================================================

[env:fase_15_aproximacao_topo]

build_src_filter =
    -<*>
    +<fase_15_aproximacao_topo/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 16 — Região de captura automática
;
; Objetivos:
; - caracterizar a chegada do swing-up ao topo
; - registrar beta, betaDot, phi e phiDot
; - determinar experimentalmente a região de captura
; - preparar a transferência para o controlador BALANCE
;
; O BALANCE pode permanecer desativado nesta fase.
; ============================================================

[env:fase_16_captura_automatica]

build_src_filter =
    -<*>
    +<fase_16_captura_automatica/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 17 — Transição SWING_UP -> CAPTURE -> BALANCE
;
; Objetivos:
; - integrar swing-up com a captura
; - transferir automaticamente para o controlador
;   de quatro estados já validado
; - preservar o BALANCE existente sem alterar seus ganhos
;
; Primeira execução automática completa.
; ============================================================

[env:fase_17_swingup_balance]

build_src_filter =
    -<*>
    +<fase_17_swingup_balance/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper


; ============================================================
; FASE 18 — Integração final e robustez do swing-up
;
; Objetivos:
; - consolidar a máquina de estados completa
; - integrar telemetria
; - avaliar repetibilidade
; - avaliar limites e saturações
; - executar séries de swing-up + balance
;
; Arquitetura final esperada:
;
; IDLE
;   |
;   v
; SWING_UP
;   |
;   v
; CAPTURE
;   |
;   v
; BALANCE
;
; ============================================================

[env:fase_18_integracao_swingup]

build_src_filter =
    -<*>
    +<fase_18_integracao_swingup/**>

lib_deps =
    robtillaart/AS5600
    waspinator/AccelStepper